<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>WebApp Packer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <header class="brand">
        <div class="brand-mark"></div>
        <div>
          <h1>WebApp Packer</h1>
          <p>把离线网页打包为桌面应用</p>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button class="tab active" data-tab="source" role="tab">1. 源内容</button>
        <button class="tab" data-tab="app" role="tab">2. 应用信息</button>
        <button class="tab" data-tab="window" role="tab">3. 窗口</button>
        <button class="tab" data-tab="capability" role="tab">4. 能力</button>
        <button class="tab" data-tab="platform" role="tab">5. 打包</button>
      </nav>

      <div class="tab-panels">
        <!-- 1. 源内容 -->
        <section class="tab-panel active" data-panel="source">
          <div class="seg">
            <button type="button" class="seg-btn active" data-src-mode="local">本地目录</button>
            <button type="button" class="seg-btn" data-src-mode="git">Git 仓库</button>
          </div>

          <!-- 本地目录模式 -->
          <div class="src-mode" data-mode="local">
            <div class="drop-zone" id="dropZone">
              <div class="drop-icon"></div>
              <p class="drop-title">拖入网页目录</p>
              <p class="drop-hint">或点击下方按钮选择</p>
            </div>
            <div class="field">
              <label>源目录</label>
              <div class="path-row">
                <input type="text" id="sourceDir" placeholder="未选择" readonly />
                <button class="btn" id="pickSourceBtn">选择…</button>
              </div>
              <p class="hint" id="sourceHint">需含 index.html；将作为整个应用的内容根目录</p>
            </div>
          </div>

          <!-- Git 仓库模式 -->
          <div class="src-mode" data-mode="git" hidden>
            <div class="field">
              <label>仓库地址</label>
              <input type="text" id="repoUrl" placeholder="https://github.com/user/repo.git" />
              <p class="hint">支持 https / git / SSH 地址；公开仓库无需鉴权</p>
            </div>
            <div class="field">
              <label>分支 / 标签 / 提交（可选）</label>
              <input type="text" id="repoRef" placeholder="如 main、v1.0.0 或 commit SHA" />
            </div>
            <div class="field">
              <label>子目录（可选）</label>
              <input type="text" id="repoSubpath" placeholder="如 docs/ ；留空表示仓库根目录" />
              <p class="hint">仅打包仓库内该子目录的内容作为应用根</p>
            </div>
          </div>

          <div class="field">
            <label>入口文件</label>
            <input type="text" id="entry" value="index.html" />
            <p class="hint">相对于源目录的 HTML 文件</p>
          </div>
        </section>

        <!-- 2. 应用信息 -->
        <section class="tab-panel" data-panel="app">
          <div class="field">
            <label>应用名称</label>
            <input type="text" id="productName" placeholder="My WebApp" />
          </div>
          <div class="field">
            <label>应用 ID</label>
            <input type="text" id="appId" placeholder="com.example.myapp" />
            <p class="hint">反域名格式，留空将自动生成</p>
          </div>
          <div class="grid-2">
            <div class="field">
              <label>版本号</label>
              <input type="text" id="version" value="1.0.0" />
            </div>
            <div class="field">
              <label>作者</label>
              <input type="text" id="author" placeholder="Your Name" />
            </div>
          </div>
          <div class="field">
            <label>应用图标（可选）</label>
            <div class="path-row">
              <input type="text" id="iconPath" placeholder="未选择（使用默认图标）" readonly />
              <button class="btn" id="pickIconBtn">选择…</button>
              <button class="btn ghost" id="clearIconBtn">清除</button>
            </div>
            <p class="hint">PNG 建议 512×512；ICO 仅 Windows 生效</p>
          </div>
          <div class="field">
            <label>主色调（默认图标）</label>
            <div class="color-row">
              <input type="color" id="accentColor" value="#2d5bff" />
              <input type="text" id="accentColorText" value="#2d5bff" />
            </div>
          </div>
        </section>

        <!-- 3. 窗口 -->
        <section class="tab-panel" data-panel="window">
          <div class="grid-2">
            <div class="field">
              <label>宽度</label>
              <input type="number" id="width" value="1200" min="320" />
            </div>
            <div class="field">
              <label>高度</label>
              <input type="number" id="height" value="800" min="240" />
            </div>
            <div class="field">
              <label>最小宽度</label>
              <input type="number" id="minWidth" value="400" min="320" />
            </div>
            <div class="field">
              <label>最小高度</label>
              <input type="number" id="minHeight" value="300" min="240" />
            </div>
          </div>
          <div class="field">
            <label>背景色</label>
            <div class="color-row">
              <input type="color" id="backgroundColor" value="#ffffff" />
              <input type="text" id="backgroundColorText" value="#ffffff" />
            </div>
          </div>
          <div class="field">
            <label>窗口初始状态</label>
            <select id="windowState">
              <option value="normal">普通窗口</option>
              <option value="maximized">最大化</option>
              <option value="fullscreen">全屏</option>
            </select>
          </div>
          <div class="toggle-list">
            <label class="toggle">
              <input type="checkbox" id="resizable" checked />
              <span>允许调整窗口大小</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="frameless" />
              <span>无边框窗口（自定义标题栏）</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="showMenuBar" />
              <span>显示菜单栏（macOS 默认显示）</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="rememberWindowState" checked />
              <span>记住窗口位置和大小</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="zoomEnabled" checked />
              <span>允许网页内缩放（Ctrl +/-）</span>
            </label>
          </div>
        </section>

        <!-- 4. 能力 -->
        <section class="tab-panel" data-panel="capability">
          <div class="toggle-list">
            <label class="toggle">
              <input type="checkbox" id="singleInstance" checked />
              <span>单实例（防止重复启动）</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="tray" />
              <span>系统托盘图标</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="minimizeToTray" />
              <span>关闭按钮最小化到托盘</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="fileApi" checked />
              <span>注入本地文件 API（window.desktopAPI.fs / dialog）</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="externalLinksInBrowser" checked />
              <span>外部链接用系统浏览器打开</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="devTools" />
              <span>启用开发者工具（F12）</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="spaFallback" />
              <span>SPA 路由回退（未知路径返回入口）</span>
            </label>
          </div>
        </section>

        <!-- 5. 打包 -->
        <section class="tab-panel" data-panel="platform">
          <div class="field">
            <label>目标平台</label>
            <div class="check-row">
              <label class="check"><input type="checkbox" id="platWin" checked /><span>Windows</span></label>
              <label class="check"><input type="checkbox" id="platMac" /><span>macOS</span></label>
              <label class="check"><input type="checkbox" id="platLinux" /><span>Linux</span></label>
            </div>
            <p class="hint" id="platformHint"></p>
          </div>
          <div class="field" id="winFormatField">
            <label>Windows 格式</label>
            <select id="winFormat">
              <option value="portable">免安装（单文件 exe）</option>
              <option value="nsis">安装包（NSIS）</option>
            </select>
          </div>
          <div class="field" id="macFormatField" style="display:none">
            <label>macOS 格式</label>
            <select id="macFormat">
              <option value="dmg">DMG 镜像</option>
              <option value="zip">ZIP 压缩包</option>
            </select>
          </div>
          <div class="field" id="linuxFormatField" style="display:none">
            <label>Linux 格式</label>
            <select id="linuxFormat">
              <option value="AppImage">AppImage</option>
            </select>
          </div>
          <div class="field">
            <label>输出目录</label>
            <div class="path-row">
              <input type="text" id="outputBase" readonly />
              <button class="btn" id="pickOutputBtn">选择…</button>
            </div>
            <p class="hint">每次打包会在该目录下创建带时间戳的子目录</p>
          </div>
        </section>
      </div>

      <footer class="actions">
        <button class="btn ghost" id="exportBtn">导出源项目</button>
        <button class="btn primary" id="packBtn">
          <span>开始打包</span>
        </button>
      </footer>
    </aside>

    <main class="main">
      <header class="main-head">
        <div>
          <h2 id="resultTitle">构建输出</h2>
          <p id="resultSubtitle">等待开始…</p>
        </div>
        <div class="progress-wrap" id="progressWrap" hidden>
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <span id="progressText">0%</span>
        </div>
      </header>

      <div class="console" id="console"></div>

      <div class="result-panel" id="resultPanel" hidden>
        <h3>产物</h3>
        <ul class="outputs" id="outputs"></ul>
        <div class="result-actions">
          <button class="btn" id="openFolderBtn">打开输出目录</button>
          <button class="btn ghost" id="openWorkDirBtn">打开工作目录</button>
        </div>
      </div>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
